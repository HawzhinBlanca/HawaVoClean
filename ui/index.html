<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HawaVoClean</title>
    <!--
      C4 · a real browser asks for /favicon.ico on the first load of any page
      that does not declare an icon, and this engine serves exactly two things
      (the built assets and the API), so that request was a 404 on every cold
      load. The scripted browser never issues it, which is why the C4 sweep
      recorded a clean network log that a person would not have seen.

      The icon is a data URI rather than a file so the build stays one folder
      of self-contained assets with no extra request to make: five bars in the
      product's own two colours — amber ORIGINAL running into cyan CLEANED.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2314171c'/%3E%3Crect%20x='.5'%20y='.5'%20width='31'%20height='31'%20rx='6.5'%20fill='none'%20stroke='%232a3139'/%3E%3Cg%20stroke-width='3'%20stroke-linecap='round'%3E%3Cpath%20d='M6.5%2012v8'%20stroke='%23ffb347'/%3E%3Cpath%20d='M11.25%208v16'%20stroke='%23ffb347'/%3E%3Cpath%20d='M16%205v22'%20stroke='%23ffd28a'/%3E%3Cpath%20d='M20.75%209v14'%20stroke='%2339d0ff'/%3E%3Cpath%20d='M25.5%2011.5v9'%20stroke='%2339d0ff'/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>html,body{margin:0;background:#0e1013;}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
