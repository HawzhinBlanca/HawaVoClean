# HawaVoClean - Neural Mono Dereverberation + Cleanup Profile
#
# Native 48 kHz-output pure discriminative mono speech dereverberation powered
# by GAP-URGENet Predictor (ESPnet TF-GridNetV3, Apache-2.0 architecture + MIT
# SHA-256 locked weights, enable_bwe = false — zero generative spectral
# synthesis, honoring HawaVoClean's Natural contract), guarded in INTEGRITY mode.
#
# Measured on real 48 kHz Sorani Kurdish speech
# (research/benchmarks/dereverb_2026_report.md, candidate 11a):
# - reverb_heavy (DRR +1 dB, RT60 1.1 s): NISQA 3.43, ESTOI 0.666, WavLM 0.8294
# - reverb_plus_noise (RT60 0.8 s, +7 dB): NISQA 3.54, ESTOI 0.639, WavLM 0.7655
# - noise_street_hum: NISQA 4.83
# - clean control: WavLM 0.9998, ESTOI 1.000
# - Apple M5 Max MPS steady-state RTF ~0.12.

[runtime]
# Dereverb declares preferred_devices = ("mps", "cuda", "cpu"), so "auto"
# selects Apple Silicon MPS or CUDA when available and falls back to CPU
# otherwise. The device that ran is recorded in environment.compute_device.
device = "auto"
isolated_worker = true
worker_timeout_s = 300.0
worker_memory_limit_mb = 8192
development = false
num_threads = 1

[input]
max_sample_rate = 48000
supported_sample_rates = [8000, 16000, 22050, 24000, 32000, 44100, 48000]
channel_mode = "auto"
output_bit_depth = "pcm24"

[segmentation]
vad_mode = "energy"
min_speech_ms = 300
target_speech_group_s = 20.0
hard_max_group_s = 30.0
pause_merge_threshold_ms = 400
context_duration_s = 1.0
min_boundary_non_speech_ms = 200

[enhancement]
core_id = "studio-dereverb-48k-v1"
model_sample_rate = 48000
phase_coherent = false
warmup_cycles = 1

[alignment]
max_delay_ms = 50.0
min_coherence = 0.60
fractional_delay = true

[guard]
guard_id = "spectral-guard-v1"
probe_id = "spectral-signature-v1"
calibration_file = "guard-calibration-dereverb.json"
mode = "integrity"
min_anchor_confidence = 0.50
max_posterior_js_div = 0.30
max_peak_js_div = 0.90
max_timing_drift_ms = 75.0
enforce_signal_integrity = true
spectral_hole_thresh = 0.30
musical_noise_thresh = 0.30
min_hf_preservation_ratio = 0.30

[policy]
strength_ladder = [1.0]
clean_audio_bypass = false
clean_bypass_snr_db = 35.0
enforce_continuity = true

[finishing]
enabled = true
preset = "gentle"
dc_subsonic_cutoff_hz = 75.0
dehum_50_60hz = true
declick = false
plosive_attenuation = false
dynamic_eq = true
tonal_restoration = true
max_tonal_gain_db = 12.0
deess_band = false
max_deess_gr_db = 4.0
level_rider = false
max_compression_gr_db = 3.0

[loudness]
target_lufs_stereo = -16.0
target_lufs_mono = -19.0
true_peak_ceiling_dbtp = -1.0
max_limiter_reduction_db = 0.5
dither = true
