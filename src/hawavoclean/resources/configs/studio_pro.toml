# HawaVoClean - Studio Pro Flagship 48 kHz Enhancement Profile
#
# Native 48 kHz MossFormer2_SE_48K neural speech enhancement (Apache-2.0,
# external SHA-256 locked weights), guarded in INTEGRITY mode.
#
# Measured on real 48 kHz Sorani Kurdish speech (Phase 1a/1c shootouts):
# - Apple Silicon MPS runs at ~0.023 RTF (13.3x faster than CPU).
# - Clean Kurdish stays transparent (SI-SDR 43.0 dB, PESQ 4.63, WavLM 1.0000).
# - Outperforms DeepFilterNet3 on street noise (+0.59 NISQA MOS, +0.05 WavLM
#   cos) and clipped speech while remaining strictly Apache-2.0.
# - No WPE pre-stage or generative CFM dereverb stage: Phase 1c proved WPE
#   hurt clean SI-SDR (43.0 -> 22.8 dB) and generative CFM hallucinated over
#   Sorani Kurdish speech.

[runtime]
# Studio Pro declares preferred_devices = ("mps", "cuda", "cpu"), so "auto"
# selects Apple Silicon MPS or CUDA when available and falls back to CPU
# otherwise. The device that ran is recorded in environment.compute_device.
device = "auto"
isolated_worker = true
worker_timeout_s = 300.0
worker_memory_limit_mb = 8192
development = false
num_threads = 1

[input]
max_sample_rate = 48000
supported_sample_rates = [8000, 16000, 22050, 24000, 32000, 44100, 48000]
channel_mode = "auto"
output_bit_depth = "pcm24"

[segmentation]
vad_mode = "energy"
min_speech_ms = 300
target_speech_group_s = 20.0
hard_max_group_s = 30.0
pause_merge_threshold_ms = 400
context_duration_s = 1.0
min_boundary_non_speech_ms = 200

[enhancement]
core_id = "studio-mossformer2-48k-v1"
model_sample_rate = 48000
phase_coherent = false
warmup_cycles = 1

[alignment]
max_delay_ms = 50.0
min_coherence = 0.60
fractional_delay = true

[guard]
guard_id = "spectral-guard-v1"
probe_id = "spectral-signature-v1"
calibration_file = "guard-calibration-studio-pro.json"
mode = "integrity"
min_anchor_confidence = 0.50
max_posterior_js_div = 0.38
max_peak_js_div = 0.90
max_timing_drift_ms = 75.0
enforce_signal_integrity = true
spectral_hole_thresh = 0.90
musical_noise_thresh = 0.30
min_hf_preservation_ratio = 0.20

[policy]
strength_ladder = [1.0]
clean_audio_bypass = false
clean_bypass_snr_db = 35.0
enforce_continuity = true

[finishing]
enabled = true
preset = "gentle"
dc_subsonic_cutoff_hz = 75.0
dehum_50_60hz = true
declick = false
plosive_attenuation = false
dynamic_eq = true
tonal_restoration = true
max_tonal_gain_db = 12.0
deess_band = false
max_deess_gr_db = 4.0
level_rider = false
max_compression_gr_db = 3.0

[loudness]
target_lufs_stereo = -16.0
target_lufs_mono = -19.0
true_peak_ceiling_dbtp = -1.0
max_limiter_reduction_db = 0.5
dither = true
