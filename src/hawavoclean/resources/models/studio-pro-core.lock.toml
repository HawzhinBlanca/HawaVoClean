# Studio Pro Flagship 48 kHz Enhancement Core Lock
#
# Pins MossFormer2_SE_48K (Alibaba ClearerVoice-Studio, Apache-2.0) parameters
# and external checkpoint SHA-256 digest. Executed natively in pure PyTorch via
# the in-tree Apache-2.0 inference module hawavoclean.enhancement.mossformer2_arch
# (torch + torchaudio + numpy; zero clearvoice runtime dependency). Unlike the
# smaller DeepFilterNet3 checkpoint, the 211 MiB MossFormer2_SE_48K checkpoint
# is not vendored inside git; its SHA-256 is pinned inside
# [params].checkpoint_sha256 and enforced by both
# probe_studio_pro_runtime_contract() (model-cold preflight / capabilities) and
# StudioProCore._ensure_model() prior to torch.load(..., weights_only=True).

