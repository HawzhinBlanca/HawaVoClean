# Neural Mono Dereverberation Core Lock (GAP-URGENet Predictor TF-GridNetV3)
#
# Pins Xiaobin-Rong/gap-urgenet Predictor.pt (MIT License, 88.5 MB) parameters
# and external checkpoint SHA-256 digest. Executed natively in pure PyTorch via
# the in-tree Apache-2.0 TF-GridNetV3 module hawavoclean.enhancement.dereverb_neural
# in strictly discriminative Natural mode (enable_bwe = false; zero generative
# spectral synthesis). Unlike the smaller DeepFilterNet3 checkpoint, the 88.5 MB
# Predictor.pt file is not vendored inside git; its SHA-256 is pinned inside
# [params].checkpoint_sha256 and enforced by both probe_dereverb_runtime_contract()
# (model-cold preflight / capabilities) and load_dereverb_model() prior to
# torch.load(..., weights_only=True).

