# Hawzhin VoiceClean - Studio Restoration Profile
#
# Strong voice restoration: WPE dereverberation + DeepFilterNet3 neural
# denoising, guarded in INTEGRITY mode. Unlike the production profile, this
# profile does not demand the output stay spectrally near-identical to the
# input — removing reverb and noise is the point. Timing, envelope,
# artifact, and signal-collapse protections remain fully enforced, and any
# unit the guard rejects keeps its original audio.
#
# Scope note: DeepFilterNet3 is a SPEECH enhancer. Sustained musical tones
# may be attenuated as non-speech. For music-heavy material, listen to the
# flagged review timecodes in the report.

[runtime]
device = "auto"
isolated_worker = true
worker_timeout_s = 300.0
worker_memory_limit_mb = 8192
development = false
num_threads = 1

[input]
max_sample_rate = 48000
supported_sample_rates = [8000, 16000, 22050, 24000, 32000, 44100, 48000]
channel_mode = "auto"
output_bit_depth = "pcm24"

[segmentation]
vad_mode = "energy"
min_speech_ms = 300
target_speech_group_s = 20.0
hard_max_group_s = 30.0
pause_merge_threshold_ms = 400
context_duration_s = 1.0
min_boundary_non_speech_ms = 200

[enhancement]
core_id = "studio-dfn3-48k-v1"
model_sample_rate = 48000
phase_coherent = false
warmup_cycles = 1

[alignment]
max_delay_ms = 50.0
min_coherence = 0.60
fractional_delay = true

[guard]
guard_id = "spectral-guard-v1"
probe_id = "spectral-signature-v1"
calibration_file = "guard-calibration-studio.json"
mode = "integrity"
min_anchor_confidence = 0.50
max_posterior_js_div = 0.30
max_peak_js_div = 0.90
max_timing_drift_ms = 75.0
enforce_signal_integrity = true
spectral_hole_thresh = 0.25
musical_noise_thresh = 0.30
min_hf_preservation_ratio = 0.50

[policy]
strength_ladder = [1.0]
clean_audio_bypass = false
clean_bypass_snr_db = 35.0
enforce_continuity = true

[finishing]
enabled = true
preset = "gentle"
dc_subsonic_cutoff_hz = 75.0
dehum_50_60hz = true
declick = true
plosive_attenuation = true
dynamic_eq = true
deess_band = true
max_deess_gr_db = 4.0
level_rider = true
max_compression_gr_db = 3.0

[loudness]
target_lufs_stereo = -16.0
target_lufs_mono = -19.0
true_peak_ceiling_dbtp = -1.0
max_limiter_reduction_db = 2.5
dither = true
