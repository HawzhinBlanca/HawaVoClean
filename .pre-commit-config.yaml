repos:
  - repo: local
    hooks:
      - id: pinned-ruff
        name: pinned ruff lint
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
      - id: pinned-ruff-format
        name: pinned ruff format
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
      - id: pinned-mypy
        name: pinned strict mypy
        entry: uv run --frozen mypy --strict src tests scripts data
        language: system
        pass_filenames: false
