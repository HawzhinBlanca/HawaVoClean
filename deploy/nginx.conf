# Reverse proxy for HawaVoClean Studio 4.0 Web-Public deployment.
# Terminate TLS in front (Cloudflare, Caddy, ALB, or certbot) for production HTTPS.

upstream hawavoclean_backend {
    server hawavoclean:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Allow audio/video uploads up to 512 MiB
    client_max_body_size 512m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # SSE job progress streams must never be buffered
    location ~ ^/api/(jobs|v1/batches)/.*/events$ {
        proxy_pass http://hawavoclean_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://hawavoclean_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
