[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hawzhin-voiceclean"
version = "2.1.0"
description = "Offline dialogue audio cleanup: Wiener denoising, spectral-change guard, BS.1770 mastering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary / All Rights Reserved" }
authors = [
    { name = "Hawzhin VoiceClean Team", email = "engineering@hawzhin.ai" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
studio = [
    "deepfilternet>=0.5.6",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "nara-wpe>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.uv]
# deepfilternet 0.5.6 declares numpy<2, a stale pin: its runtime works on
# numpy 2 (verified by the studio test suite). Override so the studio extra
# resolves against the project's numpy>=2 stack.
override-dependencies = ["numpy>=1.26.0"]

[project.scripts]
voiceclean = "voiceclean.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceclean"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "soundfile.*",
    "pyloudnorm.*",
    "scipy.*",
    "hypothesis.*",
    "df.*",
    "nara_wpe.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Quick unit tests",
    "property: Hypothesis property-based tests",
    "chaos: Fault-injection and crash recovery tests",
    "golden: Golden dataset numeric / regression tests",
    "integration: End-to-end integration tests",
    "gpu: Tests requiring GPU hardware",
]
