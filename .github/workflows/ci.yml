name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.5"
          enable-cache: true

      - name: Install system audio libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Lint check (Ruff)
        run: uv run ruff check .

      - name: Type check (Mypy strict)
        run: uv run mypy --strict src tests scripts data

      - name: Run Test Suite with Coverage
        run: uv run pytest --cov=voiceclean --cov-branch --cov-report=term-missing --cov-fail-under=90
